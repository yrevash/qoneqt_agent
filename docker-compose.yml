services:
  # ---------------------------------------------------------------------------
  #  The Consolidated "Truth" DB (Postgres + pgvector)
  # ---------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: qoneqt_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db_init:/docker-entrypoint-initdb.d
    networks:
      - qoneqt_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  #  Fast Data (Redis)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:alpine
    container_name: qoneqt_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - qoneqt_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  #  Message Queue (RabbitMQ) 
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: qoneqt_mq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"   # AMQP Protocol
      - "15672:15672" # Management UI (http://localhost:15672)
    networks:
      - qoneqt_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  # ---------------------------------------------------------------------------
  #  Application Services
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: qoneqt_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - SECRET_KEY=${SECRET_KEY}
    networks:
      - qoneqt_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./app:/app/app  # For development hot-reload (comment out in production)

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: qoneqt_worker
    restart: always
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - SECRET_KEY=${SECRET_KEY}
    networks:
      - qoneqt_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./app:/app/app  # For development hot-reload (comment out in production)
    # Uncomment for GPU access (requires nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    container_name: qoneqt_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    networks:
      - qoneqt_net
    depends_on:
      - api

  # ---------------------------------------------------------------------------
  #  LLM Inference (Ollama) - runs on host at localhost:11434
  #  Start with: ollama serve
  #  Pull model: ollama pull qwen2.5:7b
  # ---------------------------------------------------------------------------
  # Using host Ollama instance - no container needed
  # Other containers can access it via host.docker.internal:11434
  # ---------------------------------------------------------------------------
  # Tooling
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer
    container_name: qoneqt_adminer
    restart: always
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - qoneqt_net
    depends_on:
      - db
  
  # ---------------------------------------------------------------------------
  #  Observability Stack
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: qoneqt_prometheus
    restart: always
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway" # Allows access to uvicorn on host
    networks:
      - qoneqt_net

  grafana:
    image: grafana/grafana:latest
    container_name: qoneqt_grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - qoneqt_net
    depends_on:
      - prometheus

networks:
    qoneqt_net:
      driver: bridge

volumes:
    postgres_data:
    redis_data:



