# Route configuration with severity-based routing
route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default-notifications'
  
  # Routes based on severity
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      repeat_interval: 5m
      continue: true
    
    - match:
        severity: warning
      receiver: 'warning-alerts'
      repeat_interval: 30m
      continue: true
    
    - match:
        alertname: ServiceDown
      receiver: 'immediate-alerts'
      repeat_interval: 2m
      continue: true

# Inhibition rules - suppress lower severity if higher severity is active
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

receivers:
  # ============================================================
  # CRITICAL ALERTS - Goes to your email immediately
  # ============================================================
  - name: 'critical-alerts'
    email_configs:
      - to: 'yashtiwari9182@gmail.com,yash@qoneqt.com'
        send_resolved: true
        headers:
          Subject: 'CRITICAL ALERT: {{ .GroupLabels.alertname }}'
        html: |
          <h2 style="color: red;">CRITICAL ALERT</h2>
          <p><strong>Alert:</strong> {{ .GroupLabels.alertname }}</p>
          <p><strong>Status:</strong> {{ .Status }}</p>
          <p><strong>Summary:</strong> {{ .CommonAnnotations.summary }}</p>
          <p><strong>Description:</strong> {{ .CommonAnnotations.description }}</p>
          <p><strong>Time:</strong> {{ .CommonAnnotations.timestamp }}</p>
  
  # ============================================================
  # SERVICE DOWN ALERTS - Immediate notification
  # ============================================================
  - name: 'immediate-alerts'
    email_configs:
      - to: 'yashtiwari9182@gmail.com'
        send_resolved: true
        headers:
          Subject: ' SERVICE DOWN: {{ .GroupLabels.alertname }}'
  
  # ============================================================
  # WARNING ALERTS - Less urgent issues
  # ============================================================
  - name: 'warning-alerts'
    email_configs:
      - to: 'yashtiwari9182@gmail.com'
        send_resolved: true
        headers:
          Subject: ' WARNING: {{ .GroupLabels.alertname }}'
  
  # ============================================================
  # DEFAULT NOTIFICATIONS - Catch-all for other alerts
  # ============================================================
  - name: 'default-notifications'
    email_configs:
      - to: 'yashtiwari9182@gmail.com'
        send_resolved: true
